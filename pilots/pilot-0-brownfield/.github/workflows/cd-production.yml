name: Production Cloud Release (pilot-brownfield-upgrade)
on:
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via OIDC (gcp-cloudflare-github | Supported: gcp, cloudflare, github, aws, azure)
        run: echo "Deploying via GitHub Actions OIDC with automatic health-probe rollback"
